name: Rückrufe aktualisieren
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: rueckrufe
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/rueckrufe.mjs --raw
      - name: Speichern, wenn sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A rueckrufe*.json
          git diff --cached --quiet || (git commit -m "Rückrufe aktualisiert" && git push)
